[package]
name = "daw-engine"
version.workspace = true
edition.workspace = true

[dependencies]
vst3-host = { path = "../vst3-host" }
cpal = "0.18"
midir = "0.11"
hound = "3.5"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
parking_lot = "0.12"
crossbeam-channel = "0.5"
anyhow = "1"
base64 = "0.22"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "mp3", "pcm", "vorbis", "adpcm", "isomp4", "ogg", "wav", "aiff", "caf"] }
rubato = "0.15"

# Native PipeWire, PulseAudio and JACK drivers alongside ALSA, and real-time scheduling for
# the audio thread (via rtkit over D-Bus).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pipewire", "pulseaudio", "jack", "realtime-dbus"] }
