[package]
name = "vst3-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vst3 = "0.3"
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
parking_lot = "0.12"
rtrb = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "NSNotification"] }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }

# The editor example's own event loop.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSDate", "NSRunLoop", "NSObjCRuntime", "NSString"] }
