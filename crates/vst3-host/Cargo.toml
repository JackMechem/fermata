[package]
name = "vst3-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vst3 = "0.3"
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
parking_lot = "0.12"
rtrb = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
