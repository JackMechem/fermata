# Builds Fermata for Linux, Windows and macOS and publishes the bundles as a GitHub release
# when a version tag (v1.2.3, or v1.2.3-alpha.1 for a prerelease) is pushed. Pushing the
# `release-check` branch runs the same builds without releasing anything, to try a change to
# this workflow first. See docs/DEVELOPING.md, "Versioning and releases".
name: Release

on:
  push:
    tags: ["v*"]
    branches: [release-check]

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          # The section for this version, up to the next "## [" heading.
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo
            echo "- **Linux:** \`.AppImage\` (any distribution), \`.deb\` (Debian, Ubuntu), \`.rpm\` (Fedora, openSUSE)"
            echo "- **Windows:** \`_x64-setup.exe\`"
            echo "- **macOS:** \`_aarch64.dmg\` (Apple Silicon) or \`_x64.dmg\` (Intel)"
            echo
            echo "The builds aren't signed yet. On macOS, right-click the app and choose Open the first time (or run \`xattr -cr /Applications/Fermata.app\`); on Windows, choose More info › Run anyway in the SmartScreen prompt."
          } >> notes.md
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const tag = context.ref.replace("refs/tags/", "");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Fermata ${tag}`,
              body: fs.readFileSync("notes.md", "utf8"),
              draft: true,
              prerelease: tag.includes("-"),
            });
            return data.id;

  build:
    needs: create-release
    # Runs without a release on the release-check branch, where create-release is skipped.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - os: ubuntu-22.04-arm
            args: --bundles deb,rpm,appimage
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev libdbus-1-dev libclang-dev \
            pkg-config xdg-utils libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # The repo also has a pnpm lockfile; CI installs with npm.
          tauriScript: npm run tauri
          args: ${{ matrix.args }}

  publish:
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number("${{ needs.create-release.outputs.id }}"),
              draft: false,
            });
